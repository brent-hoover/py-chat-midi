[project]
name = "py-chat-midi"
version = "0.1.0"
description = "A unique chat/text based MIDI sequencer"
requires-python = ">=3.13"
dependencies = [
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "anthropic>=0.49.0",
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyinstaller>=6.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.7.2",
]

[tool.pytest.ini_options]
addopts = "--cov=sequencer --cov=server --cov=ai --cov-report=term-missing"

[tool.coverage.run]
source = ["sequencer", "server", "ai"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
